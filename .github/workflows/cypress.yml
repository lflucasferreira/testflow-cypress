name: Cypress E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: install all dependencies and populate caches ─────────────────
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v5

      - name: Checkout TestFlow app
        uses: actions/checkout@v5
        with:
          repository: qaschoolbr/testflow
          path: testflow-app

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Cache test suite node_modules
        id: cache-tests
        uses: actions/cache@v5
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}

      - name: Cache Cypress binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-bin-${{ hashFiles('package-lock.json') }}

      - name: Cache TestFlow node_modules
        id: cache-app
        uses: actions/cache@v5
        with:
          path: testflow-app/node_modules
          key: app-${{ hashFiles('testflow-app/package-lock.json') }}

      - name: Install test suite dependencies
        if: steps.cache-tests.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install TestFlow dependencies
        if: steps.cache-app.outputs.cache-hit != 'true'
        working-directory: testflow-app
        run: npm install

  # ── Stage 2: run each suite in parallel ───────────────────────────────────
  test:
    name: Cypress — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, auth, dashboard, team, settings, components]
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v5

      - name: Checkout TestFlow app
        uses: actions/checkout@v5
        with:
          repository: qaschoolbr/testflow
          path: testflow-app

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Restore test suite node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}

      - name: Restore Cypress binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-bin-${{ hashFiles('package-lock.json') }}

      - name: Restore TestFlow node_modules
        uses: actions/cache@v5
        with:
          path: testflow-app/node_modules
          key: app-${{ hashFiles('testflow-app/package-lock.json') }}

      - name: Start TestFlow
        working-directory: testflow-app
        run: npm start &

      - name: Wait for TestFlow to be ready
        run: npx wait-on http://localhost:5050/health --timeout 30000

      - name: Run Cypress — ${{ matrix.suite }}
        run: npm run cy:run:${{ matrix.suite }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-${{ matrix.suite }}
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: videos-${{ matrix.suite }}
          path: cypress/videos
          if-no-files-found: ignore

  # ── Stage 3: merge and publish all artifacts ──────────────────────────────
  report:
    name: Publish artifacts
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 5
    steps:
      - name: Download all screenshots
        uses: actions/download-artifact@v7
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: cypress/screenshots
        continue-on-error: true

      - name: Download all videos
        uses: actions/download-artifact@v7
        with:
          pattern: videos-*
          merge-multiple: true
          path: cypress/videos
        continue-on-error: true

      - name: Publish combined screenshots
        uses: actions/upload-artifact@v6
        with:
          name: all-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Publish combined videos
        uses: actions/upload-artifact@v6
        with:
          name: all-videos
          path: cypress/videos
          if-no-files-found: ignore
