name: Cypress E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: install test suite dependencies and populate caches ──────────
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Cache test suite node_modules
        id: cache-tests
        uses: actions/cache@v5
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}

      - name: Cache Cypress binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-bin-${{ hashFiles('package-lock.json') }}

      - name: Install test suite dependencies
        if: steps.cache-tests.outputs.cache-hit != 'true'
        run: npm ci

  # ── Stage 2: run each suite in parallel ───────────────────────────────────
  test:
    name: Cypress — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15
    services:
      testflow:
        image: qaschool/testflow:latest
        ports:
          - 5050:5050
        options: >-
          --health-interval 15s
          --health-timeout 10s
          --health-retries 6
          --health-start-period 90s
    strategy:
      fail-fast: false
      matrix:
        suite: [api, smoke, auth, dashboard, team, settings, components]
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Restore test suite node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}

      - name: Restore Cypress binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-bin-${{ hashFiles('package-lock.json') }}

      - name: Verify TestFlow is reachable
        continue-on-error: true
        run: curl -sf http://localhost:5050/health && echo "TestFlow OK" || echo "TestFlow not reachable"

      - name: Run Cypress — ${{ matrix.suite }}
        run: npm run cy:run:${{ matrix.suite }}

      - name: List report files
        if: always()
        run: find cypress/reports -type f 2>/dev/null || echo "cypress/reports not found"

      - name: Rename JSON report
        if: always()
        run: |
          src=$(find cypress/reports -name '*.json' 2>/dev/null | head -1)
          if [ -n "$src" ]; then
            mv "$src" "cypress/reports/${{ matrix.suite }}.json"
            echo "Renamed $src → cypress/reports/${{ matrix.suite }}.json"
          else
            echo "No JSON report found"
          fi

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: report-json-${{ matrix.suite }}
          path: cypress/reports/${{ matrix.suite }}.json
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-${{ matrix.suite }}
          path: cypress/screenshots
          if-no-files-found: ignore

  # ── Stage 3: merge JSONs and generate combined HTML report ───────────────
  report:
    name: Generate HTML report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 5
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Restore test suite node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}

      - name: Download all JSON reports
        uses: actions/download-artifact@v7
        with:
          pattern: report-json-*
          merge-multiple: true
          path: cypress/reports
        continue-on-error: true

      - name: List downloaded files
        run: find cypress/reports -type f 2>/dev/null || echo "cypress/reports not found"

      - name: Merge reports and generate HTML
        run: |
          jsons=$(find cypress/reports -name '*.json' 2>/dev/null)
          if [ -z "$jsons" ]; then
            echo "No JSON reports found — check test job logs for failures"
            exit 1
          fi
          npx mochawesome-merge cypress/reports/*.json -o cypress/reports/merged.json
          npx marge cypress/reports/merged.json \
            --reportDir cypress/reports/html \
            --reportTitle "TestFlow — Cypress Report" \
            --charts \
            --inline

      - name: Publish HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-report
          path: cypress/reports/html
          if-no-files-found: ignore
