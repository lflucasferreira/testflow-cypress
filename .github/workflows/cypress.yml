name: Cypress E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  CYPRESS_DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
  CYPRESS_CI_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # ── Stage 1: install test suite dependencies and populate caches ──────────
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Cache Cypress binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-bin-${{ hashFiles('package-lock.json') }}

      - name: Install test suite dependencies
        run: npm ci

  # ── Stage 2: smoke gate (grep @smoke) ─────────────────────────────────────
  smoke:
    name: Cypress — smoke (@smoke)
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 20
    services:
      testflow:
        image: qaschool/testflow:latest
        ports:
          - 5050:5050
        options: >-
          --health-interval 15s
          --health-timeout 10s
          --health-retries 6
          --health-start-period 90s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress smoke
        uses: cypress-io/github-action@v7
        with:
          install: true
          wait-on: 'http://localhost:5050/health'
          wait-on-timeout: 120
          command: npm run cy:run:smoke
        env:
          CYPRESS_CLOUD_GROUP: smoke-gate
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename JSON report
        if: always()
        run: |
          src=$(find cypress/reports/.jsons -name '*.json' 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            src=$(find cypress/reports -maxdepth 1 -name '*.json' 2>/dev/null | head -1)
          fi
          if [ -n "$src" ]; then
            cp "$src" "cypress/reports/smoke-gate.json"
            echo "Copied $src → cypress/reports/smoke-gate.json"
          else
            echo "No JSON report found"
          fi

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-json-smoke-gate
          path: cypress/reports/smoke-gate.json
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-smoke
          path: cypress/screenshots
          if-no-files-found: ignore

  # ── Stage 2b: regression gate (grep @regression) ──────────────────────────
  regression:
    name: Cypress — regression (@regression)
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 45
    services:
      testflow:
        image: qaschool/testflow:latest
        ports:
          - 5050:5050
        options: >-
          --health-interval 15s
          --health-timeout 10s
          --health-retries 6
          --health-start-period 90s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress regression
        uses: cypress-io/github-action@v7
        with:
          install: true
          wait-on: 'http://localhost:5050/health'
          wait-on-timeout: 120
          command: npm run cy:run:regression
        env:
          CYPRESS_CLOUD_GROUP: regression-gate
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename JSON report
        if: always()
        run: |
          src=$(find cypress/reports/.jsons -name '*.json' 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            src=$(find cypress/reports -maxdepth 1 -name '*.json' 2>/dev/null | head -1)
          fi
          if [ -n "$src" ]; then
            cp "$src" "cypress/reports/regression-gate.json"
            echo "Copied $src → cypress/reports/regression-gate.json"
          else
            echo "No JSON report found"
          fi

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-json-regression-gate
          path: cypress/reports/regression-gate.json
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-regression
          path: cypress/screenshots
          if-no-files-found: ignore

  # ── Stage 3: E2E suite — Cypress Cloud record + parallel ──────────────────
  cypress-run:
    name: Cypress — E2E (container ${{ matrix.containers }})
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 30
    services:
      testflow:
        image: qaschool/testflow:latest
        ports:
          - 5050:5050
        options: >-
          --health-interval 15s
          --health-timeout 10s
          --health-retries 6
          --health-start-period 90s
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          install: true
          wait-on: 'http://localhost:5050/health'
          wait-on-timeout: 120
          record: true
          parallel: true
          group: e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename JSON report
        if: always()
        run: |
          src=$(find cypress/reports/.jsons -name '*.json' 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            src=$(find cypress/reports -maxdepth 1 -name '*.json' 2>/dev/null | head -1)
          fi
          if [ -n "$src" ]; then
            cp "$src" "cypress/reports/e2e-container-${{ matrix.containers }}.json"
            echo "Copied $src → cypress/reports/e2e-container-${{ matrix.containers }}.json"
          else
            echo "No JSON report found"
          fi

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-json-e2e-${{ matrix.containers }}
          path: cypress/reports/e2e-container-${{ matrix.containers }}.json
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-e2e-${{ matrix.containers }}
          path: cypress/screenshots
          if-no-files-found: ignore

  component:
    name: Cypress Component Tests
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress component tests
        uses: cypress-io/github-action@v7
        with:
          install: true
          command: npm run cy:run:component
        env:
          CYPRESS_CLOUD_GROUP: component
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  visual:
    name: Percy — visual regression
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 20
    services:
      testflow:
        image: qaschool/testflow:latest
        ports:
          - 5050:5050
        options: >-
          --health-interval 15s
          --health-timeout 10s
          --health-retries 6
          --health-start-period 90s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Percy visual tests
        run: npm run cy:run:visual:percy
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        continue-on-error: true

  # ── Stage 4: merge JSONs and generate combined HTML report ───────────────
  report:
    name: Generate HTML report
    runs-on: ubuntu-latest
    needs: [cypress-run, smoke, regression]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Download all JSON reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-json-*
          merge-multiple: true
          path: cypress/reports
        continue-on-error: true

      - name: List downloaded files
        run: find cypress/reports -type f 2>/dev/null || echo "cypress/reports not found"

      - name: Merge reports and generate HTML
        run: |
          json_files=$(find cypress/reports -maxdepth 1 -name '*.json' ! -name 'merged.json' 2>/dev/null | sort)
          if [ -z "$json_files" ]; then
            echo "No JSON reports found — check test job logs for failures"
            exit 1
          fi
          echo "Found JSON report(s):"
          echo "$json_files" | sed 's/^/  /'
          npx mochawesome-merge $json_files -o cypress/reports/merged.json
          npx marge cypress/reports/merged.json \
            --reportDir cypress/reports/html \
            --reportTitle "TestFlow — Cypress Report" \
            --charts \
            --inline

      - name: Publish HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: cypress/reports/html
          if-no-files-found: ignore
