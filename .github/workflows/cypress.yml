name: Cypress E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test suite
        uses: actions/checkout@v4

      - name: Checkout TestFlow app
        uses: actions/checkout@v4
        with:
          repository: qaschoolbr/testflow
          path: testflow-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install test suite dependencies
        run: npm ci

      - name: Install TestFlow dependencies
        working-directory: testflow-app
        run: npm install

      - name: Start TestFlow
        working-directory: testflow-app
        run: npm start &

      - name: Wait for TestFlow to be ready
        run: npx wait-on http://localhost:5050/health --timeout 30000

      - name: Run Cypress
        run: npm run cy:run

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
