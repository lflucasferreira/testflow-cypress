name: Cypress E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Stage 1: install all dependencies and populate cache ──────────────────
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v4

      - name: Checkout TestFlow app
        uses: actions/checkout@v4
        with:
          repository: qaschoolbr/testflow
          path: testflow-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache test suite node_modules
        id: cache-tests
        uses: actions/cache@v4
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}

      - name: Cache TestFlow node_modules
        id: cache-app
        uses: actions/cache@v4
        with:
          path: testflow-app/node_modules
          key: app-${{ hashFiles('testflow-app/package-lock.json') }}

      - name: Install test suite dependencies
        if: steps.cache-tests.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install TestFlow dependencies
        if: steps.cache-app.outputs.cache-hit != 'true'
        working-directory: testflow-app
        run: npm install

  # ── Stage 2: start app and run Cypress ────────────────────────────────────
  test:
    name: Run Cypress
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v4

      - name: Checkout TestFlow app
        uses: actions/checkout@v4
        with:
          repository: qaschoolbr/testflow
          path: testflow-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore test suite node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}

      - name: Restore TestFlow node_modules
        uses: actions/cache@v4
        with:
          path: testflow-app/node_modules
          key: app-${{ hashFiles('testflow-app/package-lock.json') }}

      - name: Start TestFlow
        working-directory: testflow-app
        run: npm start &

      - name: Wait for TestFlow to be ready
        run: npx wait-on http://localhost:5050/health --timeout 30000

      - name: Run Cypress
        run: npm run cy:run

  # ── Stage 3: publish test artifacts ───────────────────────────────────────
  report:
    name: Publish artifacts
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v4

      - name: Upload screenshots on failure
        if: needs.test.result == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
