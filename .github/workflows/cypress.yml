name: Cypress E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  CYPRESS_DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}

jobs:
  # ── Stage 1: install test suite dependencies and populate caches ──────────
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Cache test suite node_modules
        id: cache-tests
        uses: actions/cache@v5
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}

      - name: Cache Cypress binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-bin-${{ hashFiles('package-lock.json') }}

      - name: Install test suite dependencies
        if: steps.cache-tests.outputs.cache-hit != 'true'
        run: npm ci

  # ── Stage 2: smoke gate (grep @smoke) ─────────────────────────────────────
  smoke:
    name: Cypress — smoke (@smoke)
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 20
    services:
      testflow:
        image: qaschool/testflow:latest
        ports:
          - 5050:5050
        options: >-
          --health-interval 15s
          --health-timeout 10s
          --health-retries 6
          --health-start-period 90s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-bin-${{ hashFiles('package-lock.json') }}
      - run: npm run cy:run:smoke

      - name: Rename JSON report
        if: always()
        run: |
          src=$(find cypress/reports/.jsons -name '*.json' 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            src=$(find cypress/reports -maxdepth 1 -name '*.json' 2>/dev/null | head -1)
          fi
          if [ -n "$src" ]; then
            cp "$src" "cypress/reports/smoke-gate.json"
            echo "Copied $src → cypress/reports/smoke-gate.json"
          else
            echo "No JSON report found"
          fi

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: report-json-smoke-gate
          path: cypress/reports/smoke-gate.json
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-smoke
          path: cypress/screenshots
          if-no-files-found: ignore

  # ── Stage 2b: regression gate (grep @regression) ──────────────────────────
  regression:
    name: Cypress — regression (@regression)
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 45
    services:
      testflow:
        image: qaschool/testflow:latest
        ports:
          - 5050:5050
        options: >-
          --health-interval 15s
          --health-timeout 10s
          --health-retries 6
          --health-start-period 90s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-bin-${{ hashFiles('package-lock.json') }}
      - run: npm run cy:run:regression

      - name: Rename JSON report
        if: always()
        run: |
          src=$(find cypress/reports/.jsons -name '*.json' 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            src=$(find cypress/reports -maxdepth 1 -name '*.json' 2>/dev/null | head -1)
          fi
          if [ -n "$src" ]; then
            cp "$src" "cypress/reports/regression-gate.json"
            echo "Copied $src → cypress/reports/regression-gate.json"
          else
            echo "No JSON report found"
          fi

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: report-json-regression-gate
          path: cypress/reports/regression-gate.json
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-regression
          path: cypress/screenshots
          if-no-files-found: ignore

  # ── Stage 3: run each suite in parallel ───────────────────────────────────
  test:
    name: Cypress — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15
    services:
      testflow:
        image: qaschool/testflow:latest
        ports:
          - 5050:5050
        options: >-
          --health-interval 15s
          --health-timeout 10s
          --health-retries 6
          --health-start-period 90s
    strategy:
      fail-fast: false
      matrix:
        suite: [api, smoke, auth, dashboard, team, settings, components, wizard, advanced, activity, states]
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Restore test suite node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}

      - name: Restore Cypress binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-bin-${{ hashFiles('package-lock.json') }}

      - name: Verify TestFlow is reachable
        continue-on-error: true
        run: curl -sf http://localhost:5050/health && echo "TestFlow OK" || echo "TestFlow not reachable"

      - name: Run Cypress — ${{ matrix.suite }}
        run: npm run cy:run:${{ matrix.suite }}

      - name: List report files
        if: always()
        run: find cypress/reports -type f 2>/dev/null || echo "cypress/reports not found"

      - name: Rename JSON report
        if: always()
        run: |
          src=$(find cypress/reports/.jsons -name '*.json' 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            src=$(find cypress/reports -maxdepth 1 -name '*.json' 2>/dev/null | head -1)
          fi
          if [ -n "$src" ]; then
            cp "$src" "cypress/reports/${{ matrix.suite }}.json"
            echo "Copied $src → cypress/reports/${{ matrix.suite }}.json"
          else
            echo "No JSON report found"
          fi

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: report-json-${{ matrix.suite }}
          path: cypress/reports/${{ matrix.suite }}.json
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-${{ matrix.suite }}
          path: cypress/screenshots
          if-no-files-found: ignore

  component:
    name: Cypress Component Tests
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-bin-${{ hashFiles('package-lock.json') }}
      - run: npm run cy:run:component

  visual:
    name: Percy — visual regression
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 20
    services:
      testflow:
        image: qaschool/testflow:latest
        ports:
          - 5050:5050
        options: >-
          --health-interval 15s
          --health-timeout 10s
          --health-retries 6
          --health-start-period 90s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-bin-${{ hashFiles('package-lock.json') }}
      - name: Run Percy visual tests
        run: npm run cy:run:visual:percy
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        continue-on-error: true

  # ── Stage 4: merge JSONs and generate combined HTML report ───────────────
  report:
    name: Generate HTML report
    runs-on: ubuntu-latest
    needs: [test, smoke, regression]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Restore test suite node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: tests-${{ hashFiles('package-lock.json') }}

      - name: Download all JSON reports
        uses: actions/download-artifact@v7
        with:
          pattern: report-json-*
          merge-multiple: true
          path: cypress/reports
        continue-on-error: true

      - name: List downloaded files
        run: find cypress/reports -type f 2>/dev/null || echo "cypress/reports not found"

      - name: Merge reports and generate HTML
        run: |
          json_files=$(find cypress/reports -maxdepth 1 -name '*.json' ! -name 'merged.json' 2>/dev/null | sort)
          if [ -z "$json_files" ]; then
            echo "No JSON reports found — check test job logs for failures"
            exit 1
          fi
          echo "Found JSON report(s):"
          echo "$json_files" | sed 's/^/  /'
          npx mochawesome-merge $json_files -o cypress/reports/merged.json
          npx marge cypress/reports/merged.json \
            --reportDir cypress/reports/html \
            --reportTitle "TestFlow — Cypress Report" \
            --charts \
            --inline

      - name: Publish HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-report
          path: cypress/reports/html
          if-no-files-found: ignore
